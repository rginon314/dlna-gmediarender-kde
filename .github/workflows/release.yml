name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Plasma package (.plasmoid)
        run: |
          # Un .plasmoid est une archive zip du répertoire plasmoid/.
          # On exclut les fichiers de build et les .po non compilés.
          cd plasmoid
          zip -r "../dlna-gmediarender-${{ steps.version.outputs.version }}.plasmoid" . \
              -x '*.git*' 'build-translations.sh' 'po/*'

      - name: Create source tarball
        run: |
          tar czf "dlna-gmediarender-${{ steps.version.outputs.version }}.tar.gz" \
              --transform 's,^,dlna-gmediarender-${{ steps.version.outputs.version }}/,' \
              README.md LICENSE install.sh bin/ systemd/ plasmoid/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dlna-gmediarender-${{ steps.version.outputs.version }}.plasmoid
            dlna-gmediarender-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}